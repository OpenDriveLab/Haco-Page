name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static project page
        run: |
          mkdir -p _site/app
          cp index.html _site/index.html
          cp app/globals.css _site/app/globals.css
          cp -R public/. _site/
          sed -i 's|src="/|src="./|g; s|public/videos/|videos/|g; s|https://opendrivelab.github.io/Haco/public/og.png|https://opendrivelab.github.io/Haco-Page/og.png|g' _site/index.html
          sed -i 's|../public/|../|g' _site/app/globals.css
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
